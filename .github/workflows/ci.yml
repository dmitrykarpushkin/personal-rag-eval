name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Unit tests only: chunking, fusion, grep baseline, gold set integrity.
    # The retrieval and answer evals need Postgres + pgvector and local models (see README).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy pyyaml pytest
      - run: pytest -q
