[project]
name = "prag"
version = "0.1.0"
description = "Hybrid retrieval (Postgres FTS + pgvector + cross-encoder) over a personal markdown notebook, with a gold-set eval"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "numpy",
  "pyyaml",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
# prag.mcp_server uses FastMCP from the 1.x SDK (renamed to MCPServer in 2.x)
mcp = ["mcp>=1.10,<2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
