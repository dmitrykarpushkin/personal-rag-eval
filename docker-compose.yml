services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prag
      POSTGRES_PASSWORD: prag
      POSTGRES_DB: prag
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prag"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
